name: Fork CI
on:
  pull_request:
    branches:
      - komira/base
      - komira/sha512-kwarg
  push:
    branches:
      - 'komira/ci-**'
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: Install the Rust toolchain from rust-toolchain.toml
      run: |
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component llvm-tools-preview --component rust-src
        rustup default "$channel"
        rustc --version
    - name: Install system packages
      run: sudo apt-get update && sudo apt-get install -y libzstd-dev
    - name: Restore the cargo cache
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: fork-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}
        restore-keys: |
          fork-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          fork-ci-${{ runner.os }}-
    - name: Build the buck2 binary
      run: cargo build --locked --bin=buck2
    - name: Keep the binary for the end-to-end tests
      run: strip -o "$RUNNER_TEMP/buck2-head" target/debug/buck2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: buck2-head
        path: ${{ runner.temp }}/buck2-head
        retention-days: 3
    - name: Test the touched crates
      run: cargo test --locked --no-fail-fast -p buck2_execute -p buck2_action_impl -p remote_execution
    - name: Cargo.lock is up to date
      run: git diff --exit-code Cargo.lock
    # Saved even when a step above failed, so that a fix does not start from a cold build.
    - name: Save the cargo cache
      if: always()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ steps.cache.outputs.cache-primary-key }}

  # The binary of the commit this fork is based on, so that the end-to-end tests of what existing
  # callers get can run against it as well as against the change.
  base-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      with:
        ref: komira/base
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: Install the Rust toolchain from rust-toolchain.toml
      run: |
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component llvm-tools-preview --component rust-src
        rustup default "$channel"
    - name: Install system packages
      run: sudo apt-get update && sudo apt-get install -y libzstd-dev
    - name: Restore the cargo cache
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: fork-ci-base-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}
        restore-keys: |
          fork-ci-base-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          fork-ci-base-${{ runner.os }}-
    - name: Build the buck2 binary
      run: cargo build --locked --bin=buck2
    - name: Keep the binary for the end-to-end tests
      run: strip -o "$RUNNER_TEMP/buck2-base" target/debug/buck2
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: buck2-base
        path: ${{ runner.temp }}/buck2-base
        retention-days: 3
    - name: Save the cargo cache
      if: always()
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ steps.cache.outputs.cache-primary-key }}

  # buck2's own end-to-end tests (the pytest files under tests/core, with the harness in
  # tests/e2e_util) for `download_file`, against a local HTTP server. Upstream runs them only
  # inside its own build system; here the harness is driven directly with pytest.
  download-file-e2e:
    needs: [build-and-test, base-binary]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        path: ${{ runner.temp }}/bin
    - name: Install the test dependencies
      run: |
        sudo apt-get update && sudo apt-get install -y libzstd1
        python3 -m venv "$RUNNER_TEMP/venv"
        "$RUNNER_TEMP/venv/bin/pip" install pytest==8.3.5 pytest-asyncio==0.26.0 aiohttp==3.11.18 decorator==5.2.1 psutil==7.0.0
        chmod +x "$RUNNER_TEMP"/bin/*/buck2-*
    - name: Set up the harness outside the build system that normally runs it
      run: |
        # The tests import `buck2.tests.e2e_util...`; the repository root is that `buck2` package.
        mkdir -p "$RUNNER_TEMP/pyroot"
        ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/pyroot/buck2"
        # Only the in-repo flavour of tests reads this; the tests run here are all isolated.
        printf 'fbmake = {"build_rule": "oss"}\n' > "$RUNNER_TEMP/pyroot/__manifest__.py"
    - name: Run the download_file tests
      run: |
        # Run from outside the checkout: it holds a buck2.py that would shadow the package.
        cd "$RUNNER_TEMP"
        export PYTHONPATH="$RUNNER_TEMP/pyroot"
        export BUCK2_E2E_TEST_FLAVOR=isolated BUCK2_MAX_BLOCKING_THREADS=8 BUCK2_RUNTIME_THREADS=8
        export NANO_PRELUDE="$GITHUB_WORKSPACE/tests/e2e_util/nano_prelude"
        actions="$GITHUB_WORKSPACE/tests/core/build/actions"
        # These five need a remote execution server, which the open-source build has none of.
        needs_re="test_is_uploaded_from_disk or test_uses_the_cas_when_it_has_the_content or test_content_the_cas_holds_needs_no_url or test_a_second_checksum_is_not_checked_against_content_the_cas_serves or test_a_wrong_size_is_a_miss_in_the_cas"
        # These three assume a build of buck2 that the open-source one is not: it sends no HEAD
        # request before a GET, and it has no BLAKE3-KEYED digest. They fail the same way on the
        # binary built from the base commit.
        not_oss="test_retries_transient_errors or test_a_server_without_head_support or test_a_content_based_path_under_a_different_preferred_digest"
        run() { # binary, test module, expression selecting the tests
          TEST_EXECUTABLE="$1" TEST_REPO_DATA="$actions/${2}_data" "$RUNNER_TEMP/venv/bin/pytest" \
            -p buck2.tests.e2e_util.conftest --asyncio-mode=auto --import-mode=importlib \
            -p no:cacheprovider -v -rfE -k "($3) and not ($needs_re) and not ($not_oss)" "$actions/$2.py"
        }
        status=0
        echo "::group::What existing callers get, binary built from the base commit"
        run "$RUNNER_TEMP/bin/buck2-base/buck2-base" test_download_file "legacy" || status=1
        echo "::endgroup::"
        echo "::group::The same tests, binary built from this change"
        run "$RUNNER_TEMP/bin/buck2-head/buck2-head" test_download_file "test" || status=1
        echo "::endgroup::"
        echo "::group::sha512 tests, binary built from this change"
        run "$RUNNER_TEMP/bin/buck2-head/buck2-head" test_download_file_sha512 "test" || status=1
        echo "::endgroup::"
        exit $status
