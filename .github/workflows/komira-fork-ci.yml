name: Fork CI
on:
  pull_request:
    branches:
      - komira/base
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CARGO_INCREMENTAL: 0
      CARGO_TERM_COLOR: always
    steps:
    - uses: actions/checkout@v6
    - name: Free disk space
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
    - name: Install the Rust toolchain from rust-toolchain.toml
      run: |
        channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
        rustup toolchain install "$channel" --profile minimal --component llvm-tools-preview --component rust-src
        rustup default "$channel"
        rustc --version
    - name: Install system packages
      run: sudo apt-get update && sudo apt-get install -y libzstd-dev
    - name: Restore the cargo cache
      id: cache
      uses: actions/cache/restore@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: fork-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-${{ github.run_id }}
        restore-keys: |
          fork-ci-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-
          fork-ci-${{ runner.os }}-
    - name: Build the buck2 binary
      run: cargo build --bin=buck2
    - name: Test the touched crates
      run: cargo test --no-fail-fast -p remote_execution -p re_grpc_proto -p buck2_execute -p buck2_action_impl
    - name: Cargo.lock is up to date
      run: git diff --exit-code Cargo.lock
    # Saved even when a step above failed, so that a fix does not start from a cold build.
    - name: Save the cargo cache
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          target
        key: ${{ steps.cache.outputs.cache-primary-key }}
