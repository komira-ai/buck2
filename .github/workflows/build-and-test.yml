name: Build and test
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch: # allows manual triggering

permissions:
  contents: read

# A pull request's superseded run is cancelled; on `main` the run in flight
# finishes so that every push still gets a verdict (see build-with-buck2.yml).
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests run on Linux x86_64 only. The macOS and Windows legs run on
  # pushes to main and on manual runs, as the beta stage after a merge.
  platforms:
    name: platforms
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.matrix.outputs.pr }}
      all: ${{ steps.matrix.outputs.all }}
    steps:
    - id: matrix
      env:
        FACEBOOK: ${{ github.repository_owner == 'facebook' }}
      run: |
        if [ "$FACEBOOK" = true ]; then
          linux=16-core-ubuntu; macos=macos-14-xlarge; windows=windows-8-core
        else
          linux=ubuntu-latest; macos=macos-14; windows=windows-latest
        fi
        l="{\"name\":\"linux\",\"runs-on\":\"$linux\"}"
        m="{\"name\":\"macos\",\"runs-on\":\"$macos\"}"
        w="{\"name\":\"windows\",\"runs-on\":\"$windows\"}"
        echo "pr=[$l]" >> "$GITHUB_OUTPUT"
        echo "all=[$l,$m,$w]" >> "$GITHUB_OUTPUT"
  # Clippy and rustdoc check the crates; the tests build them. The two share no
  # artifacts, so they run as separate jobs for wall time.
  #
  # Runner labels are repository (owner) specific, so the Meta larger runners
  # (16-core-ubuntu, macos-14-xlarge, windows-8-core) don't exist on forks and
  # jobs requesting them would sit queued forever waiting for a runner that
  # isn't available. Fall back to the standard GitHub-hosted runners there.
  lint:
    name: lint (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && needs.platforms.outputs.pr || needs.platforms.outputs.all) }}
    needs: platforms
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
      with:
        components: clippy
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-lint
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Run clippy
      run: python3 test.py --ci --git --lint-only
      shell: bash
    - name: Run rustdoc
      run: python3 test.py --ci --git --rustdoc-only
      shell: bash
  test:
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && needs.platforms.outputs.pr || needs.platforms.outputs.all) }}
    needs: platforms
    runs-on: ${{ matrix.runs-on }}
    steps:
    - uses: actions/checkout@v6
    - uses: ./.github/actions/setup_cargo_env
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: buck2-test
        cache-on-failure: true
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Run the tests
      run: python3 test.py --ci --git --test-only
      shell: bash
